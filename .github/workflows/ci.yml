name: Orca-Wails
on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./...
      - run: go vet ./...
      - shell: bash
        run: |
          for script in scripts/test-*.mjs; do node "$script" || exit; done
          node --check assets/tray/panel.js
      - if: runner.os == 'macOS'
        run: |
          python3 scripts/test-follow-orca.py
          scripts/build-macos.sh --no-core
      - if: runner.os == 'Windows'
        run: scripts/build-windows.ps1
